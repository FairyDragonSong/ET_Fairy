global:
  scrape_interval: 30s
  scrape_timeout: 10s

rule_files:
  - et-infrastructure.rules.yml

scrape_configs:
  - job_name: windows-host
    static_configs:
      - targets:
          - 127.0.0.1:9182

  - job_name: mongodb
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 127.0.0.1:9216
    metric_relabel_configs:
      - source_labels:
          - __name__
        regex: '^(mongodb_up|mongodb_rs_members_(health|state|optimeDate)|mongodb_ss_(connections|opcounters|wt_cache_(bytes_currently_in_the_cache|maximum_bytes_configured)))$'
        action: keep
